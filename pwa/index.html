<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EdgeEcho</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #start-btn {
            background-color: #03dac6;
            color: #000;
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(3, 218, 198, 0.3);
            transition: transform 0.1s;
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        #status {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #bbbbbb;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <button id="start-btn">Start Listening</button>
    <div id="status">Ready</div>

    <!-- TFJS and TFLite Runtime -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.9/dist/tf-tflite.min.js"></script>
    <script src="app.js"></script>

    <script>
        // Register the Service Worker for Offline Mode
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker Registered"))
                .catch(err => console.error("Service Worker Failed", err));
        }
    </script>
</body>

</html>
